# ==============================================================================
# Fail2ban Jail: Payroll Insight Pro API Abuse & Brute Force Ban
# ==============================================================================
[payroll-api]
enabled  = true
port     = http,https
filter   = payroll-api
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 60
bantime  = 3600
action   = iptables-multiport[name=payroll-api, port="http,https"]
