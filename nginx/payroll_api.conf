# ==============================================================================
# Payroll Insight Pro — Production Nginx Reverse Proxy & DDoS Hardening Conf
# ==============================================================================

# 1. Slowloris & Connection Exhaustion Defense: Limit concurrent TCP connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# 2. General API Rate Limiting: 2 requests/sec (120 req/min) with burst capacity of 30
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=2r/s;

# 3. Sensitive Auth Rate Limiting: 20 req/min (10 req / 30s) with burst capacity of 5
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=20r/m;

# 4. File Upload Rate Limiting: 10 req/min with burst capacity of 2
limit_req_zone $binary_remote_addr zone=api_upload_limit:10m rate=10r/m;

# Upstream Ktor Backend Service
upstream ktor_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name api.payroll.institution.gov;

    # Redirect all HTTP to HTTPS in production
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.payroll.institution.gov;

    # SSL / TLS Modern Cryptography Configuration
    ssl_certificate     /etc/ssl/certs/payroll_api.crt;
    ssl_certificate_key /etc/ssl/private/payroll_api.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers against Clickjacking, MIME-sniffing, XSS
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # DDoS & Slowloris Buffer & Timeout Hardening
    limit_conn conn_limit_per_ip 20; # Max 20 concurrent connections per IP
    client_body_timeout   10s;       # Drop slow sending attackers
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;

    # Maximum payload size (supports up to 30 MB Excel rosters)
    client_max_body_size 30M;

    # Return standard JSON on Rate Limit exceeded (HTTP 429)
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"message":"Rate limit exceeded. Too many requests. Please retry in 30 seconds.","data":{"retryAfterSeconds":"30"}}';
    }

    # 1. Authentication Endpoints: Strict 10 requests / 30 seconds
    location /api/auth/ {
        limit_req zone=api_auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://ktor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. File Upload Endpoints: Strict 10 uploads / 60 seconds
    location /api/employees/upload-excel {
        limit_req zone=api_upload_limit burst=2 nodelay;
        limit_req_status 429;

        client_max_body_size 30M;
        proxy_pass http://ktor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. General API Routes: 120 req / minute
    location / {
        limit_req zone=api_general_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://ktor_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
