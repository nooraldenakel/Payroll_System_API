version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: payroll-postgres
    environment:
      POSTGRES_DB: payroll_insight_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: payroll-api
    ports:
      - "8080:8080"
    environment:
      # Point host to the service name 'postgres'
      JDBC_DATABASE_URL: "jdbc:postgresql://postgres:5432/payroll_insight_db"
      DB_USER: "postgres"
      DB_PASSWORD: "1234"
    depends_on:
      - postgres

volumes:
  postgres_data: